services:
  # ============================================================================
  # BrandProof Backend API Web Service (FastAPI + Uvicorn)
  # ============================================================================
  - type: web
    name: brandproof-backend
    env: python
    rootDir: backend
    plan: standard
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: "BrandProof Brand Governance Platform"
      - key: DATABASE_URL
        fromDatabase:
          name: brandproof-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ENABLE_DEMO_RESET
        value: "false"
      - key: ENABLE_DEMO_MODE
        value: "false"
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_DIR
        value: /var/data/storage
      # Set CORS_ORIGINS to your Vercel frontend URL, e.g. https://your-brandproof.vercel.app
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: brandproof-storage
      mountPath: /var/data/storage
      sizeGB: 10

# ==============================================================================
# BrandProof PostgreSQL Database
# ==============================================================================
databases:
  - name: brandproof-db
    plan: standard
    databaseName: brandproof
    user: brandproof
